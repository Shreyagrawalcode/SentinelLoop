version: '3.8'
services:
  wazuh:
    image: wazuh/wazuh:4.7.0
    ports:
      - "1514:1514"
      - "55000:55000"
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_var:/var/ossec/var

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --reload

volumes:
  wazuh_etc:
  wazuh_var: